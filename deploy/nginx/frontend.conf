# z-graph 前端 Nginx 配置:静态资源 + /api 反向代理到 z-graph-server
# upstream 在 nginx 官方 entrypoint 里通过 envsubst 把 ${Z_GRAPH_API_UPSTREAM}
# 替换为环境变量值(默认 z-graph-server:8090,服务名解析)。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream z_graph_api {
    server ${Z_GRAPH_API_UPSTREAM};
    keepalive 16;
}

# GZIP 压缩配置
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

server {
    listen 80;
    server_name _;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前端静态资源 — Vite 构建产物在 /usr/share/nginx/html
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用:history fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 静态资源长期缓存(Vite 构建带 hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # favicon 短期缓存
    location = /favicon.svg {
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # API 反向代理:前端代码走 /api/xxx,这里去掉 /api 前缀后转发到 z-graph-server
    location /api/ {
        proxy_pass http://z_graph_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;

        # API 响应不缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
