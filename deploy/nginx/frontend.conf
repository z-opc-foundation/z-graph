# z-graph 前端 Nginx 配置:静态资源 + /api 反向代理到 z-graph-server
# upstream 在 nginx 官方 entrypoint 里通过 envsubst 把 ${Z_GRAPH_API_UPSTREAM}
# 替换为环境变量值(默认 z-graph-server:8090,服务名解析)。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream z_graph_api {
    server ${Z_GRAPH_API_UPSTREAM};
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 前端静态资源 — Vite 构建产物在 /usr/share/nginx/html
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用:history fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API 反向代理:前端代码走 /api/xxx,这里去掉 /api 前缀后转发到 z-graph-server
    location /api/ {
        proxy_pass http://z_graph_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # 健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
