# z-graph 分布式部署 — docker-compose
#
# 启动: docker compose -f deploy/docker/docker-compose.yml --profile distributed up -d
# 停止: docker compose -f deploy/docker/docker-compose.yml down
# 查看: docker compose -f deploy/docker/docker-compose.yml logs -f z-graph-server
#
# 部署模式(profile):
#   distributed: z-graph-server + z-graph-frontend(默认)
#   all-in-one:  单容器一体化部署
#   cluster:     多实例拓扑示例

name: z-graph

x-common-env: &common-env
  Z_GRAPH_BOLT_PORT: 7687
  Z_GRAPH_HTTP_PORT: 8090
  Z_GRAPH_CORS_ALLOWED_ORIGINS: "*"
  # 安全配置:生产环境请设置 Z_GRAPH_API_TOKEN
  # Z_GRAPH_API_TOKEN: "your-secret-token-here"
  Z_GRAPH_RATE_LIMIT: "0"  # 0=不限, 建议生产设置 100-600

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-resource-limits: &server-limits
  cpus: "2.0"
  memory: 1024M

services:
  # ========== z-graph-server ==========
  z-graph-server:
    image: ghcr.io/z-opc-foundation/z-graph-server:${Z_GRAPH_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    container_name: z-graph-server
    restart: unless-stopped
    ports:
      - "7687:7687"
      - "8090:8090"
    environment:
      <<: *common-env
      Z_GRAPH_DATA_DIR: /var/lib/z-graph
      # JVM 调优:容器感知内存
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
    volumes:
      - z-graph-data:/var/lib/z-graph
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: *server-limits
    logging: *default-logging
    networks:
      - z-graph-net

  # ========== z-graph-frontend ==========
  z-graph-frontend:
    image: ghcr.io/z-opc-foundation/z-graph-frontend:${Z_GRAPH_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    container_name: z-graph-frontend
    restart: unless-stopped
    depends_on:
      z-graph-server:
        condition: service_healthy
    ports:
      - "3333:80"
    environment:
      Z_GRAPH_API_UPSTREAM: z-graph-server:8090
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging: *default-logging
    networks:
      - z-graph-net
    profiles: ["distributed", "frontend"]

  # ========== z-graph-all-in-one ==========
  z-graph-all-in-one:
    image: ghcr.io/z-opc-foundation/z-graph-all-in-one:${Z_GRAPH_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/all-in-one.Dockerfile
    container_name: z-graph-all-in-one
    restart: unless-stopped
    ports:
      - "3000:3000"   # 控制台 + API 反代
      - "7687:7687"   # Bolt
      - "8090:8090"   # HTTP 控制面
    environment:
      <<: *common-env
      Z_GRAPH_DATA_DIR: /var/lib/z-graph
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
    volumes:
      - z-graph-data:/var/lib/z-graph
    deploy:
      resources:
        limits: *server-limits
    logging: *default-logging
    networks:
      - z-graph-net
    profiles: ["all-in-one"]

  # ========== cluster 示例 ==========
  z-graph-server-node-2:
    image: ghcr.io/z-opc-foundation/z-graph-server:${Z_GRAPH_IMAGE_TAG:-latest}
    container_name: z-graph-server-2
    restart: unless-stopped
    ports:
      - "7688:7687"
      - "8091:8090"
    environment:
      <<: *common-env
      Z_GRAPH_DATA_DIR: /var/lib/z-graph
    volumes:
      - z-graph-data-2:/var/lib/z-graph
    deploy:
      resources:
        limits: *server-limits
    logging: *default-logging
    networks:
      - z-graph-net
    profiles: ["cluster"]

  z-graph-server-node-3:
    image: ghcr.io/z-opc-foundation/z-graph-server:${Z_GRAPH_IMAGE_TAG:-latest}
    container_name: z-graph-server-3
    restart: unless-stopped
    ports:
      - "7689:7687"
      - "8092:8090"
    environment:
      <<: *common-env
      Z_GRAPH_DATA_DIR: /var/lib/z-graph
    volumes:
      - z-graph-data-3:/var/lib/z-graph
    deploy:
      resources:
        limits: *server-limits
    logging: *default-logging
    networks:
      - z-graph-net
    profiles: ["cluster"]

volumes:
  z-graph-data:
  z-graph-data-2:
  z-graph-data-3:

networks:
  z-graph-net:
    driver: bridge
